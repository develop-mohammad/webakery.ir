<script>
(function(){
  var a=[5.5,8,4,9.5], b=[4.2,6.1,4.5,7], labels=['فروردین','اردیبهشت','خرداد','تیر'];
  var w=960,h=280,pl=52,pr=16,pt=24,pb=42, pw=w-pl-pr, ph=h-pt-pb, max=10.5;
  function pts(arr){return arr.map(function(v,i){var x=pl+(i/(arr.length-1))*pw; var y=pt+ph-(v/max)*ph; return [x,y];});}
  function line(p){return p.map(function(pt,i){return (i?'L':'M')+pt[0].toFixed(1)+' '+pt[1].toFixed(1);}).join(' ');}
  function area(p){var d=line(p); var last=p[p.length-1], first=p[0]; return d+' L'+last[0]+' '+(pt+ph)+' L'+first[0]+' '+(pt+ph)+' Z';}
  var pa=pts(a), pb=pts(b);
  var grid='';
  for(var g=0;g<=4;g++){var gy=pt+(g/4)*ph; grid+='<line class="wap-gsc-grid" x1="'+pl+'" x2="'+(w-pr)+'" y1="'+gy+'" y2="'+gy+'"/>';}
  var svg='<svg class="wap-gsc-svg" viewBox="0 0 '+w+' '+h+'"><defs><linearGradient id="f1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a73e8" stop-opacity="0.28"/><stop offset="100%" stop-color="#1a73e8" stop-opacity="0.02"/></linearGradient></defs>'+grid+
    '<line class="wap-gsc-axis-line" x1="'+pl+'" x2="'+(w-pr)+'" y1="'+(pt+ph)+'" y2="'+(pt+ph)+'"/>'+
    '<path class="wap-gsc-area" d="'+area(pa)+'" fill="url(#f1)"/>'+
    '<path class="wap-gsc-line wap-gsc-line-a" d="'+line(pa)+'" fill="none"/>'+
    '<path class="wap-gsc-line wap-gsc-line-b" d="'+line(pb)+'" fill="none"/>';
  pa.forEach(function(p){svg+='<circle class="wap-gsc-dot wap-gsc-dot-a" cx="'+p[0]+'" cy="'+p[1]+'" r="3.5"/>';});
  pb.forEach(function(p){svg+='<circle class="wap-gsc-dot wap-gsc-dot-b" cx="'+p[0]+'" cy="'+p[1]+'" r="3.5"/>';});
  labels.forEach(function(lb,i){svg+='<text class="wap-gsc-xlabel" x="'+pa[i][0]+'" y="'+(h-14)+'" text-anchor="middle">'+lb+'</text>';});
  svg+='</svg>';
  document.getElementById('demo_period').innerHTML=svg;
})();
</script>
