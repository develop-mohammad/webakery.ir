<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پیامک واریز شاپرک — فقط یک پیامک</title>
<style>
body{font-family:Tahoma,sans-serif;background:#f0f0f1;margin:0;color:#1d2327}
.wrap{max-width:760px;margin:24px auto;padding:0 16px 40px}
h1{font-size:23px;font-weight:400}
.card{background:#fff;border:1px solid #c3c4c7;border-radius:6px;padding:16px 20px;margin:16px 0}
.gone{color:#b32d2e;text-decoration:line-through;opacity:.6;font-size:13px;margin:4px 0}
.ok{color:#1e7e34;font-size:14px;line-height:1.8}
.button{display:inline-block;background:#2271b1;color:#fff;border:0;padding:6px 14px;border-radius:3px;font-size:13px}
code{background:#f6f7f7;padding:1px 5px;border:1px solid #dcdcde}
</style>
</head>
<body>
<div class="wrap">
  <h1>پیامک واریز شاپرک</h1>
  <p class="ok">فقط <strong>یک پیامک</strong> برای واریز به حساب — همان واریزی که معمولاً <strong>یک روز بعد</strong> توسط زرین‌پال (شاپرک) انجام می‌شود.<br>پیامک لحظهٔ پرداخت مشتری ارسال نمی‌شود.</p>
  <div class="card">
    <div class="gone">۱) پیامک بعد از پرداخت مشتری</div>
    <div class="ok">✓ واریز شاپرک به حساب (وضعیت PAID) — فعال</div>
    <p style="font-size:13px;color:#646970">پایش ساعتی API زرین‌پال → برای هر واریز جدید یک پیامک</p>
    <button class="button" type="button">ذخیره تنظیمات</button>
  </div>
</div>
</body>
</html>
