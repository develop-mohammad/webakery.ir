appId: ir.webakery.daftarchi
productName: Daftarchi
copyright: Copyright © webakery.ir
artifactName: "${productName}-Setup-${version}.${ext}"
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"
extraMetadata:
  main: dist-electron/main.js
npmRebuild: true
win:
  executableName: Daftarchi
  icon: resources/icon.png
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: دفترچی
  uninstallDisplayName: دفترچی
  installerLanguages:
    - fa_IR
    - en_US
  language: "1065"
  deleteAppDataOnUninstall: false
portable:
  artifactName: "${productName}-Portable-${version}.${ext}"
linux:
  target:
    - AppImage
  category: Office
  icon: resources/icon.png
  artifactName: "${productName}-${version}.${ext}"
