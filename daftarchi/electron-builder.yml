appId: ir.webakery.daftarchi
productName: دفترچی
copyright: Copyright © webakery.ir
artifactName: "${productName}-${version}-${os}.${ext}"
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"
extraMetadata:
  main: dist-electron/main.js
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: دفترچی
  installerLanguages:
    - fa_IR
    - en_US
  language: "1065"
linux:
  target:
    - dir
mac:
  target:
    - dir
