appId: ir.webakery.daftarchi
productName: Daftarchi
copyright: Copyright © webakery.ir
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.linux.node"
asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"
extraMetadata:
  main: dist-electron/main.js
extraFiles:
  - from: resources/INSTALL-WINDOWS.txt
    to: INSTALL-WINDOWS.txt
  - from: resources/Start-Daftarchi.cmd
    to: Start-Daftarchi.cmd
  - from: resources/Install-Daftarchi.cmd
    to: Install-Daftarchi.cmd
npmRebuild: false
forceCodeSigning: false
win:
  executableName: Daftarchi
  icon: resources/icon.png
  signAndEditExecutable: false
  artifactName: "${productName}-${version}-win-${arch}.${ext}"
  requestedExecutionLevel: asInvoker
  target:
    - target: zip
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: "${productName}-Setup-${version}.${ext}"
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: Daftarchi
  uninstallDisplayName: Daftarchi
  installerLanguages:
    - en_US
  language: "1033"
  deleteAppDataOnUninstall: false
  warningsAsErrors: false
portable:
  artifactName: "${productName}-Portable-${version}.${ext}"
linux:
  target:
    - AppImage
  category: Office
  icon: resources/icon.png
  artifactName: "${productName}-${version}.${ext}"
