<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسیر خرید تا واریز — Hesabdar</title>
<link rel="stylesheet" href="https://fonts.bunny.net/css?family=vazirmatn:400,500,600,700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>body{background:#f8f9fa;margin:0}.wap-wrap{max-width:980px;margin:24px auto;padding:0 16px 40px}</style>
</head>
<body class="wap-body">
<div class="wap-wrap">
  <header class="wap-header"><div class="wap-brand">پرتال حسابدار — مسیر واریز</div></header>
  <p class="wap-hint">فقط یک پیامک: تاریخ واریز + مبلغ خالص. کل مسیر در پنل دیده می‌شود.</p>
  <div class="wap-flow-steps">
    <div class="wap-flow-step is-done"><span class="wap-flow-num">۱</span><strong>خرید مشتری</strong><small>۱۲ سفارش — ۱۸٬۴۵۰٬۰۰۰ تومان</small></div>
    <div class="wap-flow-arrow">←</div>
    <div class="wap-flow-step is-active"><span class="wap-flow-num">۲</span><strong>تأیید شاپرک</strong><small>۱ در حال تسویه</small></div>
    <div class="wap-flow-arrow">←</div>
    <div class="wap-flow-step is-done"><span class="wap-flow-num">۳</span><strong>واریز به حساب</strong><small>۳ تسویه شده — ۳۸٬۷۹۵٬۰۰۰ ریال</small></div>
  </div>
  <div style="background:#fff;border:1px solid #dadce0;border-radius:8px;padding:14px 16px;max-width:360px">
    <strong style="display:block;margin-bottom:8px">نمونه پیامک</strong>
    <pre style="margin:0;white-space:pre-wrap;font-family:Tahoma,sans-serif;line-height:1.8">واریز خالص به حساب
مبلغ: 38,795,000 ریال
تاریخ واریز: امروز ۰۴:۰۰</pre>
  </div>
</div>
</body>
</html>
