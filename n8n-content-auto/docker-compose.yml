services:
  n8n:
    image: n8nio/n8n:1.70.1
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      GENERIC_TIMEZONE: Asia/Tehran
      TZ: Asia/Tehran
      N8N_SECURE_COOKIE: "false"
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/import:ro
      - ./prompts:/prompts:ro

volumes:
  n8n_data:
